services:
  - type: web
    name: rag-system-api
    env: python
    plan: free
    autoDeploy: true
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python scripts/download_minilm_onnx.py
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: RAG_KB_BACKEND
        value: pgvector
      - key: RAG_EMBED_BACKEND
        value: onnx
      - key: LLM_PROVIDER
        value: hf_space
      - key: HF_SPACE_ID
        value: Elizabetyonas/rag-qwen
      - key: HF_SPACE_API_NAME
        value: /predict
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
